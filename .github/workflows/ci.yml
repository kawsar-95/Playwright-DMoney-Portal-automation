name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The portal is a shared live environment (see CLAUDE.md), so the suite only runs on demand —
  # never automatically on every push/PR — to avoid creating test accounts on someone else's run.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run regression
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SYSTEM_EMAIL: ${{ secrets.SYSTEM_EMAIL }}
          SYSTEM_PASSWORD: ${{ secrets.SYSTEM_PASSWORD }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
          AGENT_NEW_PASSWORD: ${{ secrets.AGENT_NEW_PASSWORD }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-regression
          path: playwright-report-regression/
          retention-days: 7
